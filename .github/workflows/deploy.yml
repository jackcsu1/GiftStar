name: Deploy GiftStar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check Cloudflare secrets
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets → Actions, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci

      - name: Find or create the database
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="giftstar") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create giftstar
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="giftstar") | .uuid')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml

      - run: npx wrangler d1 migrations apply giftstar --remote

      # The family roster is kept in a repo secret so names stay out of this public repo.
      - name: Load family roster (first deploy only)
        env:
          ROSTER: ${{ secrets.ROSTER }}
        run: |
          count=$(npx wrangler d1 execute giftstar --remote --json --command "SELECT COUNT(*) AS n FROM people" | jq -r '.[0].results[0].n')
          if [ "$count" = "0" ] && [ -n "$ROSTER" ]; then
            printf '%s' "$ROSTER" > roster.sql
            npx wrangler d1 execute giftstar --remote --file roster.sql
            rm roster.sql
          fi

      - name: Deploy worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://giftstar-api\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set app secrets
        env:
          FAMILY_PASSCODE: ${{ secrets.FAMILY_PASSCODE }}
          ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          jq -n --arg f "$FAMILY_PASSCODE" --arg a "$ADMIN_PASSCODE" --arg k "$ANTHROPIC_API_KEY" \
            '{FAMILY_PASSCODE:$f, ADMIN_PASSCODE:$a, ANTHROPIC_API_KEY:$k} | with_entries(select(.value != ""))' > secrets.json
          npx wrangler secret bulk secrets.json
          rm secrets.json

  web:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build site
        working-directory: web
        env:
          VITE_API: ${{ needs.api.outputs.url }}
        run: |
          if [ -z "$VITE_API" ]; then echo "::error::Couldn't find the worker URL in the deploy output."; exit 1; fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
