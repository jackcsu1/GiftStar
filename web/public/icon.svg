<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6aa6"/>
      <stop offset="0.45" stop-color="#7fb6e6"/>
      <stop offset="0.8" stop-color="#d6e9f9"/>
      <stop offset="1" stop-color="#f4f9fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="150" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fff1c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff1c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f0b93a"/>
      <stop offset="1" stop-color="#c98a14"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff3c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="256" cy="420" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd877"/>
      <stop offset="1" stop-color="#e09a2a"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21426a"/>
      <stop offset="1" stop-color="#132a46"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Light falling from the star onto the stable -->
  <path d="M256 160 L196 430 L316 430 Z" fill="url(#beam)"/>

  <!-- Distant twinkling stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="70" r="3.5" opacity="0.9"/>
    <circle cx="120" cy="140" r="2.5" opacity="0.7"/>
    <circle cx="430" cy="60" r="3" opacity="0.9"/>
    <circle cx="460" cy="150" r="2.5" opacity="0.7"/>
    <circle cx="385" cy="110" r="2" opacity="0.6"/>
    <circle cx="160" cy="48" r="2" opacity="0.7"/>
    <circle cx="40" cy="190" r="2" opacity="0.5"/>
    <path d="M100 98 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" opacity="0.95"/>
    <path d="M412 196 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z" opacity="0.85"/>
  </g>

  <circle cx="256" cy="150" r="170" fill="url(#glow)"/>

  <!-- Star of Bethlehem -->
  <g>
    <path d="M256 22 L268 136 L372 150 L268 164 L256 318 L244 164 L140 150 L244 136 Z" fill="url(#gold)"/>
    <path d="M256 92 L266 140 L314 150 L266 160 L256 208 L246 160 L198 150 L246 140 Z" fill="#ffe7a0" transform="rotate(45 256 150)"/>
    <circle cx="256" cy="150" r="16" fill="#fffbe9"/>
  </g>

  <!-- Hills -->
  <path d="M0 400 Q130 360 260 392 T512 380 L512 512 L0 512 Z" fill="#3c6896" opacity="0.55"/>
  <path d="M0 448 Q256 400 512 448 L512 512 L0 512 Z" fill="url(#hill)"/>

  <!-- Stable -->
  <g fill="#1a3557">
    <path d="M168 372 L256 314 L344 372 L326 372 L326 448 L186 448 L186 372 Z"/>
    <rect x="160" y="366" width="192" height="10" rx="3"/>
  </g>
  <!-- Warm doorway with the manger -->
  <path d="M222 448 L222 404 Q256 380 290 404 L290 448 Z" fill="url(#lamp)"/>
  <path d="M236 446 L276 446 L270 428 L242 428 Z" fill="#8a5a1c"/>
  <path d="M240 430 Q256 420 272 430 Z" fill="#ffe9a8"/>

  <!-- Three wise men on camels, walking toward the stable -->
  <defs>
    <g id="camel">
      <path d="M0 0 q6 -16 18 -16 q8 -14 18 0 q10 -2 14 -14 l4 -10 q8 -2 10 4 l-4 4 l-6 20 q-2 8 -10 10 l0 22 l-4 0 l-1 -20 l-14 0 l-3 20 l-4 0 l0 -20 l-10 0 l-2 20 l-4 0 l0 -20 q-4 -2 -4 -10 z"/>
      <path d="M18 -18 q0 -14 9 -18 l-2 -6 l3 3 l2 -5 l2 5 l3 -3 l-2 6 q9 4 9 18 z"/>
    </g>
  </defs>
  <g fill="#132a46">
    <use href="#camel" transform="translate(10 430) scale(0.68)"/>
    <use href="#camel" transform="translate(60 423) scale(0.68)"/>
    <use href="#camel" transform="translate(110 417) scale(0.68)"/>
  </g>
</svg>
